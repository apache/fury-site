name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check archived docs availability
        id: docs-archive
        run: |
          if git ls-remote --exit-code --heads origin docs-archive-pre-1.0 >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Archive branch is not ready; keeping the existing all-version build."
          fi

      - name: Checkout archived docs
        if: steps.docs-archive.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: docs-archive-pre-1.0
          path: archived-docs-output

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v3
        with:
          python-version: 3.8.x

      - name: Unified Docs
        run: |
          python --version
          cd scripts/unified-docs
          python script.py
          ls -lR ../../i18n/zh-CN/

      - name: NPM Install
        run: npm ci --prefer-offline --fund=false

      - name: Restore Docusaurus cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: ${{ runner.os }}-node24-docusaurus-${{ hashFiles('package-lock.json') }}

      - name: Build
        env:
          DOCS_ARCHIVE_READY: ${{ steps.docs-archive.outputs.ready }}
        run: |
          npm run download-avatars
          npm run build
          if [ "$DOCS_ARCHIVE_READY" = "true" ]; then
            mkdir -p build/archive
            rsync -a --delete --exclude=.git/ archived-docs-output/ build/archive/
            ./scripts/verify-docs-archive.sh build/archive
          fi
          cp .asf.yaml build/.asf.yaml

      - uses: peaceiris/actions-gh-pages@v3
        if: github.event_name != 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: deploy
          force_orphan: false
